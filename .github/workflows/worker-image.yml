name: Worker image

# Builds docker/worker.Dockerfile. Pull requests only check that it builds; main publishes
# ghcr.io/<owner>/queuesprout-worker for amd64 and arm64 (Oracle Ampere), each on a native
# runner, then joins them under :latest and :<sha>.

on:
  pull_request:
    paths:
      - docker/worker.Dockerfile
      - .dockerignore
      - .github/workflows/worker-image.yml
      - apps/worker/**
      - packages/**
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - docker/worker.Dockerfile
      - .dockerignore
      - .github/workflows/worker-image.yml
      - apps/worker/**
      - packages/**
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/queuesprout-worker:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=worker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=worker-${{ matrix.arch }}

  publish:
    name: Publish multi-arch tags
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the architectures under :latest and :<sha>
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/queuesprout-worker
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA" \
            "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
